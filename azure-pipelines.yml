# Azure DevOps pipeline for the Weather modular monolith.
#
# CI  — runs on pull requests and main: restore, build (warnings as errors), format check,
#       Tailwind CSS drift guard, and all offline tests (unit + architecture + in-process
#       integration). The Playwright browser e2e harness is intentionally NOT run here.
#       Nerdbank.GitVersioning stamps a semantic version (version.json SSOT) and sets the run
#       number to it; the version guard fails the build if no version could be derived.
# CD  — runs only on main, after CI, with no approval gate (automatic deployment). It zip-deploys
#       the published WebUI to Azure App Service (Linux).
#
# Setup (one-time, see specs/tech-architecture/AZURE_PIPELINE_PLAN_LATEST.md):
#   * create an ARM service connection and put its name in the weather-cicd variable group
#   * add the weather-cicd group members: azureServiceConnection, webAppName,
#     dotnetRuntimeStack, vmImage, appType, deploymentMethod
#   * authorize the weather-cicd group for this pipeline (Library → group → Pipeline permissions)
#   * no Environment or Approval check is needed — the Deploy job runs automatically

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  # --- Repo-structural constants: belong in git, not a variable group ---
  - name: buildConfiguration
    value: 'Release'
  - name: solution
    value: 'Weather.sln'
  - name: webProject
    value: 'src/Weather.WebUI/Weather.WebUI.csproj'
  - name: testResultsDirectory
    value: '$(Agent.TempDirectory)/TestResults'

  # --- Toolchain: YAML defaults keep CI green even when the variable group is not linked ---
  - name: dotnetSdkVersion
    value: '10.0.x'
  - name: nodeVersion
    value: '20.x'

  # --- Agent image: CI default; the Deploy stage overrides it from the variable group ---
  - name: vmImage
    value: 'ubuntu-latest'

stages:
  - stage: CI
    displayName: 'CI — build, format, tests'
    jobs:
      - job: BuildTest
        displayName: 'Build & test (.NET 10)'
        pool:
          vmImage: '$(vmImage)'
        steps:
          # Full history is required by Nerdbank.GitVersioning; a shallow clone yields version 0.0.0.
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetSdkVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetSdkVersion)'

          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - task: Cache@2
            displayName: 'Cache NuGet packages'
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/Directory.Packages.props, **/*.csproj'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: '$(UserProfile)/.nuget/packages'

          - task: Cache@2
            displayName: 'Cache npm packages'
            inputs:
              key: 'npm | "$(Agent.OS)" | src/Weather.WebUI/package-lock.json'
              path: '$(Pipeline.Workspace)/.npm'

          - script: dotnet restore $(solution)
            displayName: 'dotnet restore'

          - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore -warnaserror
            displayName: 'dotnet build (warnings as errors)'

          - script: dotnet format $(solution) --verify-no-changes --no-restore
            displayName: 'dotnet format --verify-no-changes'

          - script: bash scripts/check-tailwind-css.sh
            displayName: 'Tailwind CSS drift guard'
            env:
              npm_config_cache: '$(Pipeline.Workspace)/.npm'

          - script: >
              dotnet test $(solution)
              --configuration $(buildConfiguration)
              --no-build
              --logger "trx;LogFileName=results.trx"
              --collect:"XPlat Code Coverage"
              --results-directory $(testResultsDirectory)
            displayName: 'dotnet test (unit + architecture + integration; no e2e)'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(testResultsDirectory)/**/*.trx'
              mergeTestResults: true
              failTaskOnFailedTests: false

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(testResultsDirectory)/**/coverage.cobertura.xml'
              failIfCoverageEmpty: false

          - script: >
              dotnet publish $(webProject)
              --configuration $(buildConfiguration)
              --no-restore
              --output $(Build.ArtifactStagingDirectory)/webapp
            displayName: 'dotnet publish WebUI'

          - script: bash scripts/check-version.sh "$(Build.ArtifactStagingDirectory)/webapp/build-info.json"
            displayName: 'Version guard (fail if no semantic version)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish versioned webapp artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/webapp'
              artifact: 'webapp-$(Build.BuildNumber)'

  - stage: Deploy
    displayName: 'CD — deploy to App Service (automatic)'
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      # Environment-scoped deployment config (Library variable group). Keys:
      #   azureServiceConnection, webAppName, dotnetRuntimeStack, vmImage, appType, deploymentMethod
      - group: geo-weather-net-prod
    jobs:
      # Plain job, not a deployment job: no Environment means no approval check can suspend the run.
      - job: DeployWebApp
        displayName: 'Deploy GeoWeather WebUI'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - download: current
            displayName: 'Download versioned webapp artifact'
            artifact: 'webapp-$(Build.BuildNumber)'

          - task: AzureWebApp@1
            displayName: 'Zip deploy to App Service (Linux)'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: '$(appType)'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/webapp-$(Build.BuildNumber)'
              runtimeStack: '$(dotnetRuntimeStack)'
              deploymentMethod: 'zipDeploy'
