# Defect registry. One entry per discovered defect.
# status: open | fixed | deferred | wontfix
bugs:
  - id: BUG-001
    title: Unknown UI routes returned an empty 404 body instead of the not-found page
    status: fixed
    severity: low
    discovered: 2026-10-14
    discovered_during: e06s03
    fixed: 2026-10-14
    area: Weather.WebUI host (middleware pipeline)
    symptom: >
      GET /nope returned 404 with Content-Length 0 and no body, instead of the styled
      NotFound page. GET /not-found directly returned 200 with the page.
    reproduction: >
      Run the host and curl an unknown non-API path, e.g. `curl -i http://localhost:PORT/nope`.
    root_cause: >
      The status-code-pages middleware was registered inside `app.UseWhen(predicate, ui =>
      ui.UseStatusCodePagesWithReExecute("/not-found"))`. UseWhen forks the pipeline; the
      re-executed /not-found request therefore never reached the endpoints mapped after it.
    resolution: >
      Register UseStatusCodePagesWithReExecute in the main pipeline (it must be able to re-run the
      endpoint middleware), and keep the API surface JSON by adding a Problem Details fallback for
      unmatched /api routes. The /_csp report's 413 now carries a JSON body so it opts out of the
      re-execute.
    regression_tests: "src/Tests/Weather.IntegrationTests/Http/UiNotFoundTests.cs"
    evidence: >
      /nope -> 404 + 5,781 B styled not-found page; /api/does-not-exist -> 404 application/problem+json
      with code RESOURCE_NOT_FOUND. 248 dotnet tests pass.
    introduced_by: e10s01 (status-code-pages scoping)
