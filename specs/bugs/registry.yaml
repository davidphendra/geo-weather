  - id: BUG-004
    title: DesignTokenTests cannot find app.css in a clean build output
    status: fixed
    severity: low
    discovered: 2026-10-15
    discovered_during: Azure DevOps CI `dotnet test` step
    fixed: 2026-10-15
    area: Weather.WebUI.UnitTests (build-output content items)
    symptom: >
      The CI `dotnet test` step fails with System.IO.FileNotFoundException for
      bin/Release/net10.0/app.css wrapped in a TypeInitializationException for DesignTokenTests;
      all 15 tests in the class fail before any assertion runs.
    reproduction: >
      rm -rf src/Tests/Weather.WebUI.UnitTests/bin/Release src/Tests/Weather.WebUI.UnitTests/obj/Release;
      dotnet build src/Tests/Weather.WebUI.UnitTests/Weather.WebUI.UnitTests.csproj -c Release;
      dotnet test src/Tests/Weather.WebUI.UnitTests/Weather.WebUI.UnitTests.csproj -c Release --no-build
      --filter "Category=DesignTokens". Fails 15/15 with the missing app.css path.
    root_cause: >
      DesignTokenTests reads tailwind.config.js and app.css from AppContext.BaseDirectory. The test
      project delivers both as build-output content items, but commit 2f6c3db removed the app.css
      <Content ... CopyToOutputDirectory="PreserveNewest" /> item while only intending to regenerate
      the stylesheet. A leftover copy in a locally built bin/Debug masked the regression; a clean
      Release CI clone has no app.css in the test output, so the static field initializer throws.
    resolution: >
      Restored the app.css content item in Weather.WebUI.UnitTests.csproj (Link="app.css",
      CopyToOutputDirectory="PreserveNewest") and added an explicit output-delivery guard test in
      DesignTokenTests (reads made lazy so a missing artifact yields a clear message, not a
      TypeInitializationException). Corrected the stale azure-pipelines.yml header comment; re-adding the
      Tailwind drift guard was left as a separate decision (removed in 89b3973).
    regression_tests: "src/Tests/Weather.WebUI.UnitTests/Design/DesignTokenTests.cs (Design_sources_are_copied_to_the_test_output)"
    evidence: >
      Clean Release run reproduced Failed: 15, Passed: 0; with the fix Category=DesignTokens passes 17/17.
      Preflight green: build 0 warnings/0 errors, dotnet format clean, 420 tests pass. Fixed on branch
      fix/design-tokens-css-copy.
    introduced_by: 2f6c3db (Remove and regenerate app.css)

  - id: BUG-005
    title: CI npm cache task fails because nothing in the pipeline writes to the cache path
    status: fixed
    severity: medium
    discovered: 2026-10-15
    discovered_during: Azure DevOps CI run (post-job Cache@2 npm save)
    fixed: 2026-10-15
    area: azure-pipelines.yml (CI Cache@2 npm step)
    symptom: >
      A CI run ends with the npm Cache@2 post-job save step failing: "Getting a pipeline cache artifact
      ... Fingerprint: npm|"Linux"|...= / There is a cache miss. / tar: /home/vsts/work/1/.npm: Cannot
      open: No such file or directory / tar: Error is not recoverable: exiting now" followed by
      "##[error]Process returned non-zero exit code: 2", failing the job even though the real CI steps
      (restore/build/format/test) had already succeeded.
    reproduction: >
      Run the pipeline. The npm cache task uses a key derived from src/Weather.WebUI/package-lock.json;
      on a first/rotated-key run it is a miss and the save step runs.
    root_cause: >
      Cache@2 saves its `path` in a post-job step by tarring it. The task pointed at
      $(Pipeline.Workspace)/.npm, but no pipeline step runs npm or sets npm_config_cache, and the Tailwind
      build is author-time only (wwwroot/app.css is committed, so the csproj BuildTailwind target never
      fires). The directory therefore never exists; on a key miss the save tars a non-existent path and
      exits 2. A cache with no producer.
    resolution: >
      Removed the npm Cache@2 task and the now-unused NodeTool@0 install (and the nodeVersion variable);
      CI never invokes the Node toolchain, so there is nothing to install or cache. Kept the NuGet cache.
      Corrected the pipeline header comment and brought AZURE_PIPELINE_PLAN_LATEST.md (Q5, shape diagram,
      toolchain variables) back in line with the pipeline.
    regression_tests: n/a (pipeline configuration)
    evidence: >
      python3 -c "yaml.safe_load('azure-pipelines.yml')" parses; grep shows no NodeTool@0 / npm step
      remains and only the NuGet Cache@2 stays. Preflight green: build 0 warnings/0 errors, dotnet format
      clean, dotnet test green.
    introduced_by: Tailwind-removal commits 89b3973 / 2f6c3db (npm cache step left behind)

  - id: BUG-006
    title: CI NuGet cache path used the Windows-only $(UserProfile), so the save step failed on Linux
    status: fixed
    severity: medium
    discovered: 2026-10-15
    discovered_during: Azure DevOps CI run (post-job Cache@2 NuGet save)
    fixed: 2026-10-15
    area: azure-pipelines.yml (CI Cache@2 NuGet step path)
    symptom: >
      The post-job "cache NuGet packages" step fails with "There is a cache miss. / tar:
      /home/vsts/work/1/s/$(UserProfile)/.nuget/packages: Cannot open: No such file or directory / tar:
      Error is not recoverable: exiting now" and "##[error]Process returned non-zero exit code: 2".
      Note the literal $(UserProfile) in the failing path.
    reproduction: >
      Run the pipeline; it executes on the ubuntu-latest agent (vmImage), and the NuGet cache key is
      stable, so first/rotated runs are misses and the post-job save step runs.
    root_cause: >
      UserProfile is an environment variable on Windows; it is undefined on the Linux agent. Azure
      Pipelines therefore leaves the token unexpanded and Cache@2 receives the literal string
      $(UserProfile)/.nuget/packages, which it resolves relative to the job working directory (the repo
      checkout, /home/vsts/work/1/s). NuGet's real global-packages folder on Linux is $HOME/.nuget/packages
      (/home/vsts/.nuget/packages), so the cache path never matches the restore folder and never exists:
      the save step tars a non-existent directory and exits 2. The cache also never stored anything, so
      every run restored the full NuGet graph from the network (a silent performance bug behind the hard
      failure).
    resolution: >
      Added a root variable NUGET_PACKAGES=$(Pipeline.Workspace)/.nuget/packages and pointed the Cache@2
      path at $(NUGET_PACKAGES). NUGET_PACKAGES is a documented NuGet environment variable and pipeline
      variables become process environment variables, so `dotnet restore` installs to exactly the cached
      directory: the cache path and the restore folder can no longer drift apart, and the post-job save
      always has a real directory to archive.
    regression_tests: n/a (pipeline configuration)
    evidence: >
      Local proof that restore honours the variable:
      NUGET_PACKAGES=/tmp/wx-cache-probe/.nuget/packages dotnet restore Weather.sln succeeded and created
      that folder (134 packages). python3 yaml.safe_load('azure-pipelines.yml') parses. Preflight green:
      build 0 warnings/0 errors, dotnet format clean, 420 tests pass.
    introduced_by: original pipeline authoring (Windows-flavoured path on a ubuntu-latest agent)
