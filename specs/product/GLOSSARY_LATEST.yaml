terms:
  - term: Bounded context
    definition: A business capability with its own model and ubiquitous language. Maps one-to-one to a module.
  - term: Module
    definition: A bounded context implemented as its own assembly set (Domain/Application/Infrastructure/IntegrationEvents) with its own composition root and data.
  - term: BuildingBlocks
    definition: Shared technical/DDD primitives (Domain, Application, Infrastructure) consumed by every module. Not a bounded context.
  - term: Composition root
    definition: The per-module place where that module's services are registered and initialized (Add<Module>Module/Initialize).
  - term: Module API
    definition: The single I<Module>Service interface the API host uses to send commands and queries into a module.
  - term: IntegrationEvent
    definition: A published contract another module may subscribe to. The only assembly of a module that other modules may reference.
  - term: Events Bus
    definition: The in-memory publish/subscribe mechanism carrying integration events between modules asynchronously.
  - term: Outbox
    definition: A per-module table/queue holding integration events until the background processor publishes them, so nothing is lost.
  - term: Geography
    definition: Bounded context owning the country and city catalog.
  - term: Weather
    definition: Core bounded context owning current-conditions retrieval, the weather domain model, temperature conversion, and dew point. Persists nothing.
  - term: Favorites
    definition: Bounded context owning a user's saved cities.
  - term: Notes
    definition: Bounded context owning user-authored weather observations.
  - term: City projection
    definition: A read model inside Favorites/Notes holding just the city data they need, kept current by CityAddedIntegrationEvent.
  - term: Country
    definition: A reference-data entity identified by an ISO-3166 alpha-2 code (e.g. "GB") with a display name.
  - term: City
    definition: A reference-data entity belonging to one Country, with a display name and geo-coordinates.
  - term: WeatherReport
    definition: The Weather module's aggregate describing current conditions for a location at an instant (UTC).
  - term: Temperature
    definition: A value object that stores Celsius internally and exposes both Celsius and Fahrenheit.
  - term: DewPoint
    definition: The temperature at which air becomes saturated; derived from temperature and relative humidity.
  - term: SkyCondition
    definition: A normalized description of the sky (Clear, Cloudy, Rain) derived from the provider payload.
  - term: WindInfo
    definition: Wind speed (m/s) and direction (degrees) with an optional cardinal direction.
  - term: WeatherNote
    definition: A user-authored note attached to a city, owned by the Notes module.
  - term: FavoriteCity
    definition: A city a user saved, owned by the Favorites module; unique per city.
  - term: Query
    definition: A read-side MediatR request that returns DTOs and never mutates state.
  - term: Command
    definition: A write-side MediatR request that mutates state and returns a created resource identifier.
  - term: Port
    definition: An interface declared in a module's Application layer and implemented in its Infrastructure (e.g. IWeatherProvider).
