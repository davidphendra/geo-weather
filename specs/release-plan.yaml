release:
  version: "0.1.0"          # non-authoritative mirror; CI/semantic-release owns the real tag
  codename: "Bounded Contexts"
  status: planning
  semantic_release: true
  bump_hint: minor
  type: greenfield
  style: "Modular Monolith (bounded contexts) + CQRS + Onion-per-module"
  reference: "https://github.com/kgrzybek/modular-monolith-with-ddd"
  immediate_epic: e09          # API response contract (ADR-0011); prerequisite for e04 (Favorites)

modules:
  - { id: M1, name: Geography, kind: supporting, owns_data: true,  db: geography.db, publishes: [CityAddedIntegrationEvent] }
  - { id: M2, name: Weather,   kind: core,       owns_data: false, db: null,         publishes: [] }
  - { id: M3, name: Journal,   kind: supporting, owns_data: true,  db: journal.db,   publishes: [], consumes: [CityAddedIntegrationEvent] }
  # async edges only: M1 -> M3. Weather is independent (provider geocodes by name).
  # Journal is the merged Favorites + Notes context (ADR-0016).

epics:
  # WSJF order (highest first). score = (BV + TC + RR) / JobSize
  - id: e00
    title: Repository Layout Scaffolding
    wsjf: 10.0
    bcps: 8
    capsule_dir: epics/e00-repo-layout
    note: LAYOUT ONLY — projects, references, solution, build config, test projects. No feature code. Unblocks all others.
  - id: e09
    title: API Response Contract
    wsjf: 9.0
    bcps: 5
    capsule_dir: epics/e09-api-response-contract
    note: RFC 9457 Problem Details with code + traceId + errors; direct-resource success; 201+Location. Retrofits Weather/Geography; contract for later modules (ADR-0011).
  - id: e01
    title: BuildingBlocks & Modular Host Skeleton
    wsjf: 9.5
    bcps: 10
    capsule_dir: epics/e01-building-blocks
    deferred: true
    note: DEFERRED until the write-module epics. Shared DDD/infra primitives, Events Bus + Outbox. The Weather module (e03) is self-contained and does not depend on it (ADR-0007).
  - id: e03
    title: Weather Module (core)
    wsjf: 8.5
    bcps: 13
    capsule_dir: epics/e03-weather
    note: Highest business value; independent of other modules.
  - id: e02
    title: Geography Module (read side)
    wsjf: 7.5
    bcps: 14
    capsule_dir: epics/e02-geography
    note: Self-contained read side (full ISO-3166 catalog). Schema + seed via EF Core migrations. Controller-based API + OpenAPI. Weather naming aligned to I<Module>Service. CityAddedIntegrationEvent (e02s03) deferred.
  - id: e06
    title: WebUI Front-End (Telemetry Slate)
    wsjf: 7.5
    bcps: 37
    capsule_dir: epics/e06-webui
    note: >
      Telemetry Slate redesign of the WebUI: Tailwind token build (committed CSS), same-origin API client,
      Weather Explorer + Favorites & Saved Notes pages, Playwright CSS-parity gate, and a CSP Level 3 header.
      Plan: specs/tech-architecture/UI_DESIGN_PLAN_LATEST.md.
  - id: e04
    title: Favorites Module
    wsjf: 6.0
    bcps: 8
    capsule_dir: epics/e04-favorites
    status: merged_into_e13
    note: "Event-driven (ADR-0010) - own schema, CityId-keyed favorites, GET list, 409 duplicate, global, RFC 9457 errors. Prerequisites: e09 (response contract), e01s01/e01s02 (EventsBus/Outbox) + e02s03. MERGED into e13 (Journal) per ADR-0016; historical record retained."
  - id: e05
    title: Notes Module
    wsjf: 5.5
    bcps: 8
    capsule_dir: epics/e05-notes
    status: merged_into_e13
    note: Own schema; consumes CityAddedIntegrationEvent into a local City projection. MERGED into e13 (Journal) per ADR-0016; historical record retained.
  - id: e13
    title: Merge Favorites and Notes into the Journal module
    wsjf: 6.5
    bcps: 12
    status: done
    capsule_dir: epics/e13-journal
    note: "Merge the Favorites and Notes bounded contexts into one Journal module (ADR-0016): one JournalContext/journal.db, one City projection/handler, routes unchanged, two contracts kept, notes.*/favorites.* instruments kept. Plan: specs/IMPACT-merge-notes-into-favorites.md."
  - id: e07
    title: Architecture & Offline Test Gates
    wsjf: 5.0
    bcps: 8
    capsule_dir: epics/e07-quality-gates
    note: Per-module + cross-module arch tests; offline end-to-end harness; coverage.
  - id: e08
    title: Documentation & Repository Tooling
    wsjf: 3.0
    bcps: 3
    capsule_dir: epics/e08-docs
    note: README, AI instructions, module map, GitHub-ready repo.
  - id: e10
    title: Single Host (merge API into WebUI)
    wsjf: 7.0
    bcps: 6
    capsule_dir: epics/e10-single-host
    note: Collapse the thin Weather.Api host into Weather.WebUI - one process serves the Blazor UI and the REST API. Preserves the e09 contract and module boundaries (ADR-0012).
  - id: e11
    title: SQLite Data File Location (App_Data)
    wsjf: 8.0
    bcps: 3
    capsule_dir: epics/e11-app-data-location
    note: Move SQLite files under App_Data (outside wwwroot); confirm against Microsoft Learn that only wwwroot is addressable; add a not-served regression guard (ADR-0013).
  - id: e12
    title: Observability (OpenTelemetry → Azure Monitor)
    wsjf: 6.5
    bcps: 21
    capsule_dir: epics/e12-observability
    note: >
      OpenTelemetry metrics/traces/logs exported to Azure Monitor via the Microsoft OpenTelemetry Distro (ADR-0014).
      Technical (HTTP RED, runtime, OpenWeatherMap, MediatR, events bus) and business (weather lookups, favorites,
      notes, integration events, api.errors) signals. Shared instruments in BuildingBlocks.Application; modules free
      of OTel packages; EF Core instrumentation out of scope; sampling 100% dev / 10% prod. Plan:
      specs/tech-architecture/OBSERVABILITY_PLAN_LATEST.md.
  - id: e14
    title: Five-Day Forecast
    wsjf: 8.0
    bcps: 18
    capsule_dir: epics/e14-forecast
    status: done
    note: >
      Populate the empty 5-day forecast section. Adds a Forecast domain (ForecastInterval -> DailyForecast ->
      WeatherForecast, city-local daily aggregation), IWeatherProvider.GetForecastAsync against
      GET /data/2.5/forecast (units=imperial, same key + resilience), GetWeatherForecast query +
      GET /api/weather/{cityName}/forecast, and the WebUI ForecastStrip/ForecastDayCard. Reverses the
      "Forecast/WeatherHistory out of scope" item. Design: specs/adr/0017-five-day-forecast.md.
  - id: e15
    title: City Map on the Weather Page
    wsjf: 6.0
    bcps: 16
    status: done
    capsule_dir: epics/e15-city-map
    note: >
      Draw the selected city on an interactive Leaflet map beneath the five-day forecast. Surfaces the
      OpenWeather `coord` block as a domain Coordinates value object on WeatherReport -> flat
      latitude/longitude on WeatherReportDto -> nullable WeatherReportModel; adds the WebUI StationMap
      component that lazily loads Leaflet 1.9.4 from unpkg (SRI-pinned) and renders OpenStreetMap standard
      tiles; switches StationHeroCard to the report coordinates with a City fallback; and whitelists the
      unpkg + tile origins in the CSP. Design: specs/adr/0018-city-map-leaflet.md (D1-D10 confirmed).
  - id: e16
    title: Application & Artifact SemVer
    wsjf: 9.0
    bcps: 15
    capsule_dir: epics/e16-app-versioning
    status: planned
    decisions: pending
    note: >
      Give the deployable a semantic version derived from source (Nerdbank.GitVersioning version.json + git
      height); stamp AssemblyVersion=major.minor / FileVersion=full / InformationalVersion=full+commit; tie
      the Azure DevOps run number and artifact name to it; emit build-info.json into the artifact; and
      surface the version at runtime in the footer, GET /version, a console startup line, the OpenTelemetry
      service.version resource attribute, and the geoweather.build.info metric. Design:
      specs/adr/0019-application-and-artifact-versioning.md.
      Plan: specs/tech-architecture/VERSIONING_PLAN_LATEST.md. Decisions D1-D10 must be confirmed first.

bugs:
  total: 1
  fixed: 1
  deferred: 0
  wontfix: 0
  registry: specs/bugs/registry.yaml
