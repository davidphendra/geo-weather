note: >
  Draw the selected city on an interactive Leaflet map beneath the five-day forecast. Surfaces the
  OpenWeather `coord` block (currently discarded) as a domain Coordinates value object on WeatherReport
  and flat latitude/longitude on WeatherReportDto; adds the WebUI StationMap component that lazily
  loads Leaflet 1.9.4 from unpkg (SRI-pinned) and renders OpenStreetMap standard tiles; switches
  StationHeroCard to the report coordinates with a City fallback; and whitelists the unpkg + tile
  origins in the CSP. Design: specs/adr/0018-city-map-leaflet.md (D1-D10 confirmed).
