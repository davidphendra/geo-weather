note: >
  Give the deployable a semantic version derived from source (Nerdbank.GitVersioning version.json +
  git height), stamp every assembly with AssemblyVersion=major.minor / FileVersion=full /
  InformationalVersion=full+commit, tie the Azure DevOps run number and artifact name to it, emit a
  self-describing build-info.json, and surface the version at runtime in the footer, GET /version, a
  console startup line, the OpenTelemetry service.version resource attribute, and the
  geoweather.build.info metric. Ops can then isolate the deployed version, count live instances per
  version, and map it to a commit. Decisions D1-D10 must be confirmed before implementation.
