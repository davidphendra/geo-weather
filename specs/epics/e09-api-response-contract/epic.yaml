note: >
  Adopt the RFC 9457 Problem Details contract with stable `code`, `traceId`, and field-level `errors`; return
  resources directly on success; 201+Location on create. One central implementation (AddProblemDetails
  customization + IExceptionHandler + error-code catalog). Retrofits the already-built Weather and Geography
  endpoints; the contract all later modules (Favorites, Notes) build to. See ADR-0011.
