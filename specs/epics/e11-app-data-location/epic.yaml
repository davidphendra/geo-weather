title: SQLite Data File Location (App_Data)
wsjf: 8.0
total_bcps: 6
status: done
kind: security
note: >
  Move SQLite files out of the host content root into a dedicated App_Data folder that is never wired to
  static-file middleware. Confirms against Microsoft Learn that only wwwroot is addressable; hardens the
  hosting layout and adds a serving regression guard. See ADR-0013.
