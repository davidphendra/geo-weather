status: done
module: M2
kind: core
owns_data: false
note: >
  FIRST implementation epic (e00 layout is done). The Weather module is read-only: no DbContext, no
  migrations, no IntegrationEvents, no cross-module reference. It is self-contained — BCL + MediatR +
  FluentValidation + HttpClient — and does NOT depend on BuildingBlocks, which is deferred to the
  write-module epics. Domain value objects are sealed records; WeatherReport is an immutable record with a
  Create factory (not an aggregate root, because nothing is persisted). The provider geocodes
  q={city},{country}; Fahrenheit -> Celsius conversion and dew-point derivation are owned by the domain.
  Design decisions are LOCKED — see DECISIONS.md (clamp dew point, decimal, no coordinates, nullable wind
  direction, key hygiene via handler + log level, typesafe SkyCondition). C# standards:
  docs/engineering/csharp-standards.md. Final task lists: e03s01 (6), e03s02 (7), e03s03 (7) — 20 tasks.
  POST-SHIP CHANGE REQUEST: e03s04 replaces the over-broad AddStandardResilienceHandler (which also enabled a
  circuit breaker + rate limiter that SCOPE_LATEST deferred) with an explicit configurable
  total -> retry -> attempt-timeout pipeline bound from OpenWeather:Resilience (ADR-0015). Done — 6 tasks,
  evidence in specs/verifications/e03s04.md; Weather module tests 70 -> 93.
