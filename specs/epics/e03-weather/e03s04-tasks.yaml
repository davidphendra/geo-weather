tasks:
  - id: 1
    description: >
      Add OpenWeatherResilienceOptions (SectionName "OpenWeather:Resilience") with [Range]-guarded
      MaxRetryAttempts (int, default 3, 0..10), RetryBaseDelaySeconds (double, default 1, 0.001..30),
      AttemptTimeoutSeconds (double, default 10, 0.1..60), TotalTimeoutSeconds (double, default 30,
      0.1..120); add OpenWeatherResilienceOptionsValidator (IValidateOptions) enforcing
      TotalTimeoutSeconds >= AttemptTimeoutSeconds. Unit-test every range and the cross-field rule.
    verify: "dotnet test src/Modules/Weather/Tests/Weather.Modules.Weather.Tests --filter Category=OpenWeatherResilienceOptions"
    risk: P1
    status: passing
    allure:
      severity: high
      categories: ["Weather", "WeatherProvider", "unit"]
  - id: 2
    description: >
      In AddWeatherModule bind OpenWeatherResilienceOptions with ValidateDataAnnotations + ValidateOnStart,
      register the validator, and replace .AddStandardResilienceHandler() with
      .AddResilienceHandler("openweather", ...) building total timeout -> retry (HttpRetryStrategyOptions:
      MaxRetryAttempts, DelayBackoffType.Exponential, UseJitter = true, Delay, ShouldRetryAfterHeader) ->
      attempt timeout, reading values from the options via ResilienceHandlerContext.ServiceProvider.
      Extend WeatherModuleWiringTests so the graph resolves and no circuit breaker/rate limiter remains.
    verify: "dotnet test src/Modules/Weather/Tests/Weather.Modules.Weather.Tests --filter Category=WeatherServiceWiring"
    risk: P0
    status: passing
    allure:
      severity: critical
      categories: ["Weather", "WeatherProvider", "integration"]
  - id: 3
    description: >
      Add behavioral retry tests in Weather.Modules.Weather.Tests using a counting stub HttpMessageHandler
      wired as the primary handler through AddWeatherModule: 503,503,200 with MaxRetryAttempts=2 -> 3 calls
      and a report; persistent 503 with MaxRetryAttempts=2 -> 3 calls and WeatherProviderException;
      MaxRetryAttempts=0 -> 1 call; 404 -> 1 call and null; HttpRequestException x2 then 200 -> 3 calls.
      Use RetryBaseDelaySeconds = 0.01 so the suite stays fast; assert call counts, never wall-clock.
    verify: "dotnet test src/Modules/Weather/Tests/Weather.Modules.Weather.Tests --filter Category=OpenWeatherResilience"
    risk: P0
    status: passing
    allure:
      severity: critical
      categories: ["Weather", "WeatherProvider", "integration"]
