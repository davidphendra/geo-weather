note: >
  Geography is built self-contained (no BuildingBlocks), consistent with the Weather module: plain sealed
  domain types, MediatR IRequest, a module-local ValidationBehavior, and EF Core in the module's own
  Infrastructure. Read side only — countries and cities (AsNoTracking, SQL-filtered). The catalog is the full
  ISO-3166 country list plus a handful of major cities each, seeded by EF Core migration scripts (C1-C4).
  The host exposes it via controller-based APIs (ADR-0009), with OpenAPI enabled. The
  CityAddedIntegrationEvent (e02s03) is now IN SCOPE — Favorites (e04) consumes it (ADR-0010 F1).
