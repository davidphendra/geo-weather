id: e12
title: Observability (OpenTelemetry → Azure Monitor)
wsjf: 6.5
total_bcps: 21
status: done
kind: cross-cutting
note: >
  Add OpenTelemetry metrics, traces, and logs to the single host and export them to Azure Monitor
  (Application Insights) through the Microsoft OpenTelemetry Distro. Technical signals (HTTP RED, runtime,
  outbound OpenWeatherMap, MediatR, events bus) and business signals (weather lookups, favorites, notes,
  integration events) are exposed to the operations team. Custom instruments live once in
  Weather.BuildingBlocks.Application; no module references an OpenTelemetry package. EF Core instrumentation
  is out of scope. Sampling is 100% dev / 10% prod. Plan: specs/tech-architecture/OBSERVABILITY_PLAN_LATEST.md;
  decision: ADR-0014.
