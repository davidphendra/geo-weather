note: >
  Populate the empty 5-day forecast section of the Weather Explorer. Adds a Forecast sub-domain
  (ForecastInterval -> DailyForecast -> WeatherForecast with city-local daily aggregation), a
  GetForecastAsync method on the existing IWeatherProvider / OpenWeatherMap adapter
  (GET /data/2.5/forecast, units=imperial, same key + resilience), a GetWeatherForecast query +
  GET /api/weather/{cityName}/forecast endpoint, and the WebUI ForecastStrip/ForecastDayCard.
  Reverses the "Forecast/WeatherHistory out of scope" item in SCOPE_LATEST.yaml.
  Design: specs/adr/0017-five-day-forecast.md. Six open decisions (D1-D6) must be confirmed before build.
