story_id: e06s01
title: Telemetry Slate design system + app shell
status: passing
bcps: 8
standards: docs/engineering/csharp-standards.md
prerequisites: [e10s01]
tasks:
  - id: 1
    description: "Add src/Weather.WebUI/package.json with tailwindcss@3.4.17 and a build:css script."
    verify: "npm --prefix src/Weather.WebUI install"
    risk: P2
    status: passing
    allure: { severity: normal, categories: ["WebUI", "Design System"] }
  - id: 2
    description: "Add tailwind.config.js (colors, borderRadius, spacing, fontFamily, fontSize verbatim from code.html) and Styles/tailwind.css; compile to wwwroot/app.css."
    verify: "npm --prefix src/Weather.WebUI run build:css && test -s src/Weather.WebUI/wwwroot/app.css"
    risk: P1
    status: passing
    allure: { severity: high, categories: ["WebUI", "Design System"] }
  - id: 3
    description: "Add the .icon-fill component-layer class (font-variation-settings: 'FILL' 1), safelisted, so no inline styles are needed."
    verify: "grep -q 'icon-fill' src/Weather.WebUI/Styles/tailwind.css"
    risk: P2
    status: passing
    allure: { severity: normal, categories: ["WebUI", "Design System"] }
  - id: 4
    description: "Commit the compiled wwwroot/app.css and add an additive MSBuild target so plain dotnet build needs no Node; exclude node_modules from output."
    verify: "dotnet build src/Weather.WebUI/Weather.WebUI.csproj --warnaserror"
    risk: P1
    status: passing
    allure: { severity: high, categories: ["WebUI", "Design System"] }
  - id: 5
    description: "Add the local placeholder logo wwwroot/img/geoweather-mark.svg."
    verify: "test -f src/Weather.WebUI/wwwroot/img/geoweather-mark.svg"
    risk: P3
    status: passing
    allure: { severity: minor, categories: ["WebUI", "Design System"] }
  - id: 6
    description: "Rebuild Components/App.razor (Google fonts + app.css, body classes, CSP nonce preserved) and MainLayout/AppHeader/AppNav/AppFooter; badge shows the runtime major version."
    verify: "dotnet build src/Weather.WebUI/Weather.WebUI.csproj --warnaserror"
    risk: P1
    status: passing
    allure: { severity: high, categories: ["WebUI"] }
  - id: 7
    description: "Remove the template UI (Counter.razor, Weather.razor, NavMenu(.css), MainLayout.razor.css, wwwroot/lib/bootstrap) and restyle Error/NotFound; Home is a styled / placeholder."
    verify: "! test -e src/Weather.WebUI/Components/Pages/Counter.razor && ! test -d src/Weather.WebUI/wwwroot/lib/bootstrap"
    risk: P1
    status: passing
    allure: { severity: high, categories: ["WebUI"] }
  - id: 8
    description: "Add the offline token-contract test: the Tailwind config declares every design token and the compiled CSS contains the shell utilities."
    verify: "dotnet test src/Tests/Weather.WebUI.UnitTests --filter Category=DesignTokens"
    risk: P1
    status: passing
    allure: { severity: high, categories: ["WebUI", "unit", "Design System"] }
notes: >
  Home.razor is a temporary / placeholder; e06s03 must replace it with WeatherExplorer.razor.
  Evidence: specs/verifications/e06s01.md.
